name: Wamali
options:
  bundleIdPrefix: ge.gela
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""   # ← აქ ჩაწერე შენი Apple Team ID (ან Xcode-ში აირჩიე)
targets:
  Wamali:
    type: application
    platform: iOS
    sources: [Wamali]
    scheme: {}
    settings:
      base:
        PRODUCT_NAME: Wamali
        PRODUCT_BUNDLE_IDENTIFIER: ge.gela.wamali   # ← საჭიროებისამებრ შეცვალე
        INFOPLIST_FILE: Wamali/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
